<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Farzad Najafi — Portfolio</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#portfolio{display:block;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="portfolio" src="portfolio-original.html" title="Farzad Najafi Portfolio"></iframe>
<script>
(function(){
 const frame=document.getElementById('portfolio');
 const serviceIcons=[
 '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 34 20 10h8l12 24M13 26h22M18 34l6-12 6 12"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 40 15v18L24 42 8 33V15zM8 15l16 9 16-9M24 24v18"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7 39 20 24 41 9 20zM9 20h30M18 20l6 21 6-21M18 12h12"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 12h30v24H9zM15 19h18M15 25h12M15 31h8M34 7v10M29 12h10"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="27" rx="4"/><path d="M7 17h34M14 13.5h.1M19 13.5h.1M16 25h16M16 30h10"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 41 17v14L24 42 7 31V17zM17 24h14M24 17v14"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="8" width="32" height="32" rx="9"/><circle cx="24" cy="24" r="8"/><path d="M34 14h.1"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 16 24 7l16 9v16l-16 9L8 32zM8 16l16 9 16-9M24 25v16M16 12l16 9"/></svg>',
 '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6v36M6 24h36M11 11l26 26M37 11 11 37"/><circle cx="24" cy="24" r="14"/></svg>'
 ];
 const serviceCSS=\`
 #services .service-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
 #services .service{isolation:isolate;position:relative;overflow:hidden;min-height:250px;padding:27px 27px 30px;border:1px solid rgba(255,255,255,.12);border-radius:27px;background:#111518 center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.035);transition:transform .35s cubic-bezier(.2,.75,.2,1),border-color .35s ease,box-shadow .35s ease;background-position:center}
 #services .service:nth-child(1){background-image:linear-gradient(120deg,rgba(7,10,12,.95) 5%,rgba(7,10,12,.72) 48%,rgba(7,10,12,.28)),url('https://images.unsplash.com/photo-1545235617-9465d2a55698?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(2){background-image:linear-gradient(120deg,rgba(7,10,12,.94) 5%,rgba(7,10,12,.68) 48%,rgba(7,10,12,.25)),url('https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(3){background-image:linear-gradient(120deg,rgba(7,10,12,.94) 5%,rgba(7,10,12,.66) 48%,rgba(7,10,12,.24)),url('https://images.unsplash.com/photo-1634942536790-2534a7f4a9f5?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(4){background-image:linear-gradient(120deg,rgba(7,10,12,.94) 5%,rgba(7,10,12,.68) 48%,rgba(7,10,12,.24)),url('https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(5){background-image:linear-gradient(120deg,rgba(7,10,12,.95) 5%,rgba(7,10,12,.70) 48%,rgba(7,10,12,.25)),url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(6){background-image:linear-gradient(120deg,rgba(7,10,12,.94) 5%,rgba(7,10,12,.67) 48%,rgba(7,10,12,.23)),url('https://images.unsplash.com/photo-1504270997636-07ddfbd48945?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(7){background-image:linear-gradient(120deg,rgba(7,10,12,.94) 5%,rgba(7,10,12,.66) 48%,rgba(7,10,12,.24)),url('https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(8){background-image:linear-gradient(120deg,rgba(7,10,12,.94) 5%,rgba(7,10,12,.68) 48%,rgba(7,10,12,.25)),url('https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1200&q=88')}
 #services .service:nth-child(9){background-image:linear-gradient(120deg,rgba(7,10,12,.94) 5%,rgba(7,10,12,.68) 48%,rgba(7,10,12,.25)),url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1200&q=88')}
 #services .service:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(181,255,46,.10),transparent 38%,rgba(255,255,255,.035) 70%,transparent);pointer-events:none}
 #services .service:after{content:"";position:absolute;width:210px;height:210px;left:-85px;bottom:-105px;border-radius:50%;border:1px solid rgba(181,255,46,.13);box-shadow:0 0 0 26px rgba(181,255,46,.025),0 0 0 52px rgba(181,255,46,.018);pointer-events:none}
 #services .service:hover{transform:translateY(-8px) scale(1.012);border-color:rgba(181,255,46,.42);box-shadow:0 25px 55px rgba(0,0,0,.30),0 0 34px rgba(181,255,46,.055)}
 #services .service .n{position:absolute;top:22px;left:23px;font-size:10px;letter-spacing:.18em;color:#c8ff64;background:rgba(8,12,14,.56);border:1px solid rgba(181,255,46,.24);border-radius:999px;padding:7px 10px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
 #services .service .service-icon{position:relative;width:61px;height:61px;display:grid;place-items:center;border-radius:18px;margin-bottom:25px;background:linear-gradient(145deg,rgba(22,28,30,.76),rgba(7,11,13,.52));border:1px solid rgba(255,255,255,.11);box-shadow:inset 0 1px rgba(255,255,255,.08),0 12px 24px rgba(0,0,0,.20);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
 #services .service .service-icon:after{content:"";position:absolute;inset:5px;border-radius:14px;border:1px solid rgba(181,255,46,.10);pointer-events:none}
 #services .service .service-icon svg{width:32px;height:32px;fill:none;stroke:#b8ff3b;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(166,255,0,.15))}
 #services .service h3{font-size:clamp(17px,1.4vw,21px);margin:0 0 9px;line-height:1.65;position:relative;text-shadow:0 3px 15px rgba(0,0,0,.7)}
 #services .service h3:after{content:"";display:block;width:34px;height:2px;margin-top:10px;border-radius:3px;background:#b8ff3b;opacity:.72;box-shadow:0 0 12px rgba(181,255,46,.18)}
 #services .service p{font-size:12px;line-height:2;color:#c8ced1;max-width:35ch;margin:0;text-shadow:0 3px 12px rgba(0,0,0,.8)}
 #services .service .arrow{left:24px;bottom:21px;font-size:20px;color:#b8ff3b;opacity:.9;transition:transform .3s ease}
 #services .service:hover .arrow{transform:translate(-4px,-4px)}
 @media(max-width:1000px){#services .service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#services .service{min-height:225px}}
 @media(max-width:620px){#services .service-grid{grid-template-columns:1fr;gap:12px}#services .service{min-height:0;padding:22px 20px 25px;border-radius:22px;background-position:center 45%}#services .service .service-icon{width:52px;height:52px;margin-bottom:17px;border-radius:15px}#services .service .service-icon svg{width:28px;height:28px}#services .service .n{top:18px;left:18px}#services .service h3{font-size:18px;margin-bottom:6px}#services .service p{font-size:12px;padding-left:15px}#services .service .arrow{left:18px;bottom:17px}}
 @media(prefers-reduced-motion:reduce){#services .service,#services .service .arrow{transition:none}}
\`
 function patchDocument(d){
    if(!d)return;
    try{
      if(!d.getElementById('premium-service-cards')){const style=d.createElement('style');style.id='premium-service-cards';style.textContent=serviceCSS;(d.head||d.documentElement).appendChild(style);}
      const about=d.querySelector('#about .about-photo img');
      if(about){about.removeAttribute('srcset');about.src='assets/about-personal.jpg?v=20260919';about.alt='Farzad Najafi';about.style.objectFit='cover';about.style.objectPosition='center center';}
      const poster=d.querySelector('#works .poster-card img,.poster-card img');
      if(poster){poster.removeAttribute('srcset');poster.src='https://github.com/user-attachments/assets/3d49b504-bdc3-405f-84a0-7fbe848a8089';poster.alt='پوستر به‌روزشده طلا و جواهر Classic';}
      d.querySelectorAll('#services .service').forEach((card,i)=>{
        if(card.querySelector('.service-icon'))return;
        const icon=d.createElement('div');icon.className='service-icon';icon.innerHTML=serviceIcons[i]||serviceIcons[8];
        const number=card.querySelector('.n'); if(number)number.insertAdjacentElement('afterend',icon); else card.prepend(icon);
      });
    }catch(e){console.error('Portfolio patch failed',e);}
   }
   function patchNested(){
    try{
      const outerDoc=frame.contentDocument;if(!outerDoc)return;
      const inner=outerDoc.querySelector('iframe');
      if(inner){
        const run=()=>{patchDocument(inner.contentDocument);};
        inner.addEventListener('load',run,{once:false});
        if(inner.contentDocument && inner.contentDocument.readyState==='complete')run();
      }else patchDocument(outerDoc);
    }catch(e){console.error('Nested portfolio access failed',e);}
   }
 frame.addEventListener('load',patchNested);
})();
</script>
</body>
</html>
