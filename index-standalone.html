<script>
(function(){
var frame=document.getElementById('portfolio');
var FINAL='https://github.com/user-attachments/assets/3d49b504-bdc3-405f-84a0-7fbe848a8089?v=20260919-final';
var imgs=[
'https://images.unsplash.com/photo-1545235617-9465d2a55698?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1634942536790-2534a7f4a9f5?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1504270997636-07ddfbd48945?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1200&q=88',
'https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1200&q=88'
];
var icons=[
'<svg viewBox="0 0 48 48"><path d="M8 34 20 10h8l12 24M13 26h22M18 34l6-12 6 12"/></svg>',
'<svg viewBox="0 0 48 48"><path d="M24 6 40 15v18L24 42 8 33V15zM8 15l16 9 16-9M24 24v18"/></svg>',
'<svg viewBox="0 0 48 48"><path d="M24 7 39 20 24 41 9 20zM9 20h30M18 20l6 21 6-21M18 12h12"/></svg>',
'<svg viewBox="0 0 48 48"><path d="M9 12h30v24H9zM15 19h18M15 25h12M15 31h8"/></svg>',
'<svg viewBox="0 0 48 48"><rect x="7" y="10" width="34" height="27" rx="4"/><path d="M7 17h34M16 25h16M16 30h10"/></svg>',
'<svg viewBox="0 0 48 48"><path d="M24 6 41 17v14L24 42 7 31V17zM17 24h14M24 17v14"/></svg>',
'<svg viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32" rx="9"/><circle cx="24" cy="24" r="8"/></svg>',
'<svg viewBox="0 0 48 48"><path d="M8 16 24 7l16 9v16l-16 9L8 32zM8 16l16 9 16-9M24 25v16"/></svg>',
'<svg viewBox="0 0 48 48"><path d="M24 6v36M6 24h36M11 11l26 26M37 11 11 37"/><circle cx="24" cy="24" r="14"/></svg>'
];
var css=[
'#services .service-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:18px!important}',
'#services .service{position:relative!important;overflow:hidden!important;min-height:250px!important;padding:27px!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:27px!important;background-color:#111518!important;background-position:center!important;background-size:cover!important;box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.05)!important;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease!important}',
'#services .service:hover{transform:translateY(-8px)!important;border-color:rgba(184,255,59,.48)!important;box-shadow:0 28px 65px rgba(0,0,0,.38),0 0 28px rgba(184,255,59,.08)!important}',
'#services .service .service-visual{display:none!important}',
'#services .service .service-icon{position:relative!important;width:60px!important;height:60px!important;display:grid!important;place-items:center!important;border-radius:17px!important;margin-bottom:24px!important;background:rgba(8,12,14,.62)!important;border:1px solid rgba(255,255,255,.14)!important;box-shadow:inset 0 1px rgba(255,255,255,.08),0 12px 28px rgba(0,0,0,.28)!important;backdrop-filter:blur(9px)!important}',
'#services .service .service-icon svg{width:31px!important;height:31px!important;fill:none!important;stroke:#b8ff3b!important;stroke-width:1.7!important;stroke-linecap:round!important;stroke-linejoin:round!important}',
'#services .service .n{color:#c8ff64!important;background:rgba(8,12,14,.58)!important;border:1px solid rgba(184,255,59,.24)!important;border-radius:999px!important;padding:7px 10px!important}',
'#services .service h3{position:relative!important;margin:0 0 9px!important;font-size:clamp(17px,1.5vw,21px)!important;text-shadow:0 3px 16px #000!important}',
'#services .service h3:after{content:""!important;display:block!important;width:34px!important;height:2px!important;margin-top:10px!important;background:#b8ff3b!important;border-radius:2px!important}',
'#services .service p{color:#d0d5d8!important;text-shadow:0 3px 14px #000!important}',
'#services .service .arrow{color:#b8ff3b!important}',
'@media(max-width:1000px){#services .service-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}',
'@media(max-width:620px){#services .service-grid{grid-template-columns:1fr!important;gap:12px!important}#services .service{min-height:0!important;border-radius:22px!important;padding:22px!important}}',
'#contact{position:relative!important;overflow:hidden!important;border:1px solid rgba(184,255,59,.26)!important;border-radius:32px!important;background:linear-gradient(135deg,#171d20,#090c0e)!important;box-shadow:0 30px 90px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.07)!important;padding:clamp(30px,5vw,64px)!important}',
'#contact:before{content:""!important;position:absolute!important;inset:0!important;background:radial-gradient(circle at 10% 20%,rgba(184,255,59,.15),transparent 30%),radial-gradient(circle at 90% 80%,rgba(184,255,59,.07),transparent 28%)!important;pointer-events:none!important}',
'#contact>*{position:relative!important;z-index:1!important}',
'#contact a{display:flex!important;align-items:center!important;justify-content:space-between!important;min-height:58px!important;margin:12px 0!important;padding:14px 20px!important;border:1px solid rgba(255,255,255,.11)!important;border-radius:18px!important;background:rgba(255,255,255,.035)!important;color:#f5f7f8!important;transition:.25s ease!important}',
'#contact a:after{content:"↗"!important;color:#b8ff3b!important;font-size:21px!important}',
'#contact a:hover{transform:translateY(-4px)!important;border-color:rgba(184,255,59,.5)!important;background:rgba(184,255,59,.07)!important}',
'#contact:after{content:"LET’S CREATE"!important;position:absolute!important;right:32px!important;bottom:24px!important;color:rgba(184,255,59,.48)!important;font-size:10px!important;letter-spacing:.3em!important;font-weight:800!important}'
].join('');
function patch(d){
 if(!d||!d.head)return;
 try{
  var s=d.getElementById('farzad-final-css');
  if(!s){s=d.createElement('style');s.id='farzad-final-css';d.head.appendChild(s);}
  s.textContent=css;
  d.querySelectorAll('.poster-card img').forEach(function(x){x.removeAttribute('srcset');x.removeAttribute('sizes');x.src=FINAL;x.alt='پوستر طلا و جواهر Classic — نسخه نهایی';});
  var about=d.querySelector('#about .about-photo img');
  if(about){about.removeAttribute('srcset');about.src='assets/about-personal.jpg?v=final';}
  d.querySelectorAll('#services .service').forEach(function(card,i){
   card.style.setProperty('background-image','linear-gradient(120deg,rgba(7,10,12,.78),rgba(7,10,12,.18)),url("'+imgs[i]+'")','important');
   if(!card.querySelector('.service-icon')){
    var box=d.createElement('div');box.className='service-icon';box.innerHTML=icons[i]||icons[8];
    var n=card.querySelector('.n');if(n)n.insertAdjacentElement('afterend',box);else card.prepend(box);
   }
  });
  d.querySelectorAll('iframe').forEach(function(f){
   try{f.addEventListener('load',function(){patch(f.contentDocument);});if(f.contentDocument)patch(f.contentDocument);}catch(e){}
  });
 }catch(e){}
}
frame.addEventListener('load',function(){patch(frame.contentDocument);});
setTimeout(function(){patch(frame.contentDocument);},1000);
setTimeout(function(){patch(frame.contentDocument);},3000);
})();
</script>
</body>
</html>
